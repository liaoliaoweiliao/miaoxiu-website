<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>苗绣·生生不息 | 数字文化创新表达平台</title>
  <meta name="description" content="以智能科技与数字创意，让千年苗绣在数字时代焕发新生" />
  <meta http-equiv="refresh" content="0; url=./src/app/page.tsx" />
  <style>
    body {
      font-family: "Noto Serif SC", "Songti SC", serif;
      background: linear-gradient(135deg, #1a2f4a 0%, #0f1d30 100%);
      color: #f5f0e6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    .container {
      max-width: 640px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
    }
    .subtitle {
      color: #d4a04c;
      letter-spacing: 0.3em;
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }
    .info {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 160, 76, 0.3);
      border-radius: 8px;
      padding: 2rem;
      text-align: left;
      margin: 2rem 0;
    }
    .info h2 {
      color: #d4a04c;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    .info p, .info li {
      line-height: 1.8;
      font-size: 0.95rem;
      color: rgba(245, 240, 230, 0.8);
    }
    .info code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
      color: #d4a04c;
      font-family: monospace;
    }
    .btn {
      display: inline-block;
      background: #c1272d;
      color: #f5f0e6;
      padding: 0.75rem 2rem;
      border-radius: 4px;
      text-decoration: none;
      margin-top: 1rem;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>苗绣·生生不息</h1>
    <div class="subtitle">MIAO EMBROIDERY · ENDLESS VITALITY</div>

    <div class="info">
      <h2>项目运行说明</h2>
      <p>本项目为 <strong>Next.js 16</strong> 应用，需通过 Node.js 运行，无法直接双击 HTML 打开。</p>
      <p>请按以下步骤启动：</p>
      <ol>
        <li>安装依赖：<code>bun install</code> 或 <code>npm install</code></li>
        <li>启动开发服务器：<code>bun run dev</code> 或 <code>npm run dev</code></li>
        <li>浏览器访问：<code>http://localhost:3000</code></li>
      </ol>
      <p>详细说明请参阅 <code>README.md</code> 文件。</p>
    </div>

    <a href="./README.md" class="btn">查看 README.md</a>
  </div>
</body>
</html>
